###############################################################################
# WeewxLive — real-time dashboard (MQTT or weewx archive)
#
# skin.en.conf: copy of skin.conf with the comments translated into English.
# weewx does NOT read this file (only skin.conf); the settings are identical.
# To use it, replace skin.conf with it (or copy the settings you need into
# weewx.conf, see below).
#
# Generates at the root of the report's HTML_ROOT folder (to be set in weewx.conf,
# [StdReport] [[WeewxLive]], e.g. HTML_ROOT = public_html/live):
#   index.html          dashboard (template, at each archive)
#   config.json         configuration of the static pages
#   wxtime.js           station time zone (dates and times of all pages)
#   i18n.js             texts of the chosen language (lang option, lang/ folder)
#   detail.html, extremes.html, ensembles.html, meteogram.html, units.html,
#   admin.html, webcam.html   translated pages (templates)
#   data/history.json   24 h series + extremes and totals of the day (at each archive)
#   data/p24h|p7d|p30d|p365d|p730d.json  detail pages and period pages
#   data/climate.json   this day / this month over the years
#   data/extremes.json  station records ("Extremes" page)
#   data/astro.json     sun and moon of the day (weewx almanac)
#   data/forecast.json  Open-Meteo forecasts, one or more models (cache)
#   data/meteogram.json Open-Meteo meteogram (cache)
#   data/ensembles.json Open-Meteo ensemble forecasts (cache)
#   archive/day-YYYY-MM-DD.html, month-YYYY-MM.html, year-YYYY.html
#                       archives per day, month, year (see [[archives]])
#   archive/climato-YYYY-MM.html, climato-YYYY.html  monthly / yearly climatology
#   *.js, style.css, img/, vendor/   files copied as is ([CopyGenerator])
# The weewx FTP/RSYNC report then uploads them to the public server.
#
# WARNING: reinstalling the extension replaces this file. To keep your
# settings, copy them into weewx.conf, [StdReport] [[WeewxLive]]
# [[[LiveJSON]]] … (see README).
###############################################################################

SKIN_NAME = WeewxLive
SKIN_VERSION = 2.09

# Page language: file lang/<language>.conf of this skin (fr: French, en: English,
# de: German, it: Italian).
# The installer also adds lang = fr to weewx.conf, [StdReport] [[WeewxLive]]: that is
# where it must be changed (lang = en), since that setting takes precedence over this one
# and over [StdReport] [[Defaults]] lang (= en in the weewx.conf of weewx 5).
# To use the value below, remove both options from weewx.conf (README, "Setting the
# language in skin.conf"); to be redone after each update.
lang = fr

[LiveJSON]
    # Window of the dashboard charts and of the rolling totals (wind rose,
    # "Total … h"): hours, 1 to 72; the "Over 24 h" changes stay over 24 h
    hours = 24
    # weewx database read
    data_binding = wx_binding
    # Displayed name (empty = [Station] location of weewx.conf)
    station_name = ""
    # Time zone of the displayed dates and times (IANA name, e.g. Europe/Paris). Empty:
    # that of the system running weewx (also the one of its days, months and years).
    # Visitors always see station time, whatever their own time zone.
    timezone = ""
    # Logo shown to the left of the station name (empty = no logo).
    # File to put in skins/WeewxLive/img/ (e.g. img/logo.png, copied with the page)
    # or full https://… address
    logo = ""
    logo_alt = ""          # alternative text (empty: decorative logo)
    logo_height = 48       # displayed height, in pixels (16 to 200)
    # Indented JSON (debugging)
    pretty = false
    # Full reload of the dashboard, in seconds (0 = never, max. 86400). Useful to pick up
    # a change to skin.conf; briefly interrupts real time.
    page_refresh = 300

    [[mqtt]]
        # true: real-time values via MQTT.
        # false: no MQTT; the dashboard is updated at each weewx archive
        # (data/history.json re-read every archive_poll seconds, shown as soon as a
        # new archive is published). The MQTT settings below are then ignored.
        enable = true
        # seconds between two re-reads of data/history.json without MQTT (15 to 3600)
        archive_poll = 60
        # Broker as seen from the visitors' BROWSER: it must be reachable
        # from the internet, over secure WebSocket if the page is served over HTTPS.
        url = wss://broker.example.org:8884/mqtt
        topic = weather/loop
        # Changes over 1 h and 24 h in the Temperature panel ("Over 1 h · Over 24 h"):
        # false = line not shown and keys below not read
        temp_deltas = true
        # keys of the MQTT message holding the temperature 1 h and 24 h ago
        temp_1h_key = OutTemp-1h_C
        temp_24h_key = OutTemp-24h_C
        # READ-ONLY user: these credentials are public.
        username = ""
        password = ""

    # ------------------------------------------------------------------
    # Parameters shown on the dashboard, in the detail pages and in the
    # "Data" menu, in the order below. One subsection per parameter:
    #   title     = displayed title (default: [Labels] [[Generic]] of the language file)
    #   column    = name of the SQLite column (weewx archive table)
    #   mqtt      = name of the measurement in the MQTT messages (before the unit suffix:
    #               outTemp for outTemp_C; case is ignored)
    #   aggregate = min-max | max | sum
    #               min-max: value, minimum and maximum (temperature, humidity…)
    #               max    : value and maximum (UV index, gusts…)
    #               sum    : total (rain, evapotranspiration…), bars + cumulative curve
    #   units     = publication unit (weewx unit name, e.g. mile, kilowatt_hour,
    #               degree_F_day, minute): extra parameters only, takes precedence over
    #               [[unit_groups]]; displayed label derived from the unit
    #   unit      = displayed label only, no conversion (takes precedence over the one from units)
    #   decimals, hint, color (CSS variable, e.g. --temp): optional
    #   enable = false: hides the parameter
    #   admin = true: parameter shown only in admin mode (dashboard, "day" pages,
    #               detail and period pages, "Data" menu); see [[admin]]
    # The 6 standard parameters (outTemp, wind, windDir, rain, outHumidity, barometer)
    # keep their specialised panel as long as their aggregate is not changed.
    # Deleting a subsection removes it from the display (in weewx.conf, which can only
    # add or change: enable = false). Without any subsection: the 6 standard ones.
    # order = id1, id2, … (optional): these parameters first, in that order, then the
    # others. Useful in weewx.conf, where added sections come after these.
    # ------------------------------------------------------------------
    [[parameters]]
        # order = outTemp, wind, windDir, rain, outHumidity, barometer
        [[[outTemp]]]
            column = outTemp
            mqtt = outTemp
            aggregate = min-max
        [[[wind]]]
            column = windSpeed
            mqtt = windSpeed
        [[[windDir]]]
            column = windDir
            mqtt = windDir
        [[[rain]]]
            column = rain
            mqtt = rain
            aggregate = sum
        [[[outHumidity]]]
            column = outHumidity
            mqtt = outHumidity
            aggregate = min-max
        [[[barometer]]]
            column = barometer
            mqtt = barometer
            aggregate = min-max
        # Examples of extra parameters (Vantage Pro 2 with solar, UV and ET sensors):
        # [[[radiation]]]
        #     title = Solar radiation
        #     column = radiation
        #     mqtt = radiation
        #     aggregate = max
        #     hint = global
        #     color = --sun
        # [[[UV]]]
        #     title = UV index
        #     column = UV
        #     mqtt = UV
        #     aggregate = max
        #     decimals = 1
        # [[[ET]]]
        #     title = Evapotranspiration
        #     column = ET
        #     mqtt = ET
        #     aggregate = sum
        #
        # Grouped panel: several measurements in the same panel (dashboard) and
        # on the same detail page (one curve per measurement). A subsection that
        # itself contains [[[[…]]]] subsections is a group:
        #   title, aggregate (min-max or max, common to the measurements), unit, decimals, hint;
        #   then one subsection per measurement: title, column, mqtt (+ unit, decimals, color).
        # Example: particulate matter (columns pm1_0, pm2_5, pm10_0 of the weewx extended schema)
        # [[[particles]]]
        #     title = Particulate matter
        #     aggregate = min-max
        #     unit = µg/m³
        #     [[[[pm1_0]]]]
        #         title = PM1
        #         column = pm1_0
        #         mqtt = pm1_0
        #     [[[[pm2_5]]]]
        #         title = PM2.5
        #         column = pm2_5
        #         mqtt = pm2_5
        #     [[[[pm10_0]]]]
        #         title = PM10
        #         column = pm10_0
        #         mqtt = pm10_0

    # Archives (menu Data → Archives), with a date picker at the top of the page:
    #   archive/day-YYYY-MM-DD.html  all dashboard panels for one day
    #   archive/month-YYYY-MM.html   statistics and charts of each parameter for one month
    #   archive/year-YYYY.html       same for one year
    # The page of the current period is regenerated at each archive; past periods
    # only once.
    [[archives]]
        # false: pages of the corresponding type not generated
        # "day" pages disabled by default (one page per day of the database: long first
        # generation and large FTP upload); true to enable them (see days)
        day = false
        month = true
        year = true
        # monthly and yearly climatological tables (archive/climato-YYYY-MM.html and
        # climato-YYYY.html, "Climatology" menu)
        climato = true
        # method of the climatological tables:
        #   civil: days from 0:00 to 24:00, station time (weewx daily summaries)
        #   omm  : WMO hourly rules (UTC hours): Tn from D-1 18:00 to D 18:00, Tx and
        #          rain from D 06:00 to D+1 06:00, mean temperature = mean of the 8
        #          three-hourly readings (00, 03 … 21:00); wind, humidity, pressure: 0:00 to 24:00
        climato_method = civil
        # number of "day" pages produced, going back from today (0 = all since the
        # start of the data: the first generation can then take a long time;
        # e.g. 365 to limit to the last 365 days)
        days = 0

    # "Extremes" page (Data menu)
    [[extremes]]
        # number of rows of each ranking (3 to 50)
        top = 10
        # minimum daily rain (mm, value included) for a day of a "wet spell"
        rain_day_threshold = 0.2
        # fraction (0 to 1; "75" = 75 %) of the day covered by measurements for it to be taken into account
        # (daily means, complete months, dry / wet spells)
        min_day_coverage = 0.75

    # "Webcam" page ("Webcam" menu, webcam.html): images (jpg, png, gif, webp) and
    # videos (mp4, webm…) one below the other, in the order of the subsections. One
    # subsection per item:
    #   url      = address of the file: https://…, /path or path relative to the site
    #              (e.g. img/webcam.jpg, file placed in skins/WeewxLive/img/)
    #   title    = displayed title; caption = caption below the item (optional)
    #   type     = image | video (optional: derived from the extension, .mp4 -> video)
    #   admin    = true: shown only in admin mode ("Settings → Admin" menu)
    #   refresh  = images: reload every N seconds (0 = never; default:
    #              refresh option of [[webcam]], 60)
    #   autoplay = true: video started automatically, muted, looped
    #   enable   = false: item hidden
    # No subsection: no "Webcam" menu. The menu only appears if the visitor can see at
    # least one item. WARNING: the addresses of admin items remain readable in
    # config.json (simple hiding on display).
    [[webcam]]
        refresh = 60
        # [[[lake]]]
        #     title = View of the lake
        #     url = https://example.org/webcam/lake.jpg
        # [[[timelapse]]]
        #     title = Today's timelapse
        #     url = https://example.org/webcam/timelapse.mp4
        #     admin = true

    # "Lightning" menu: opens in a new tab the Blitzortung lightning map
    # (https://maps.blitzortung.org) centred on the station: latitude / longitude of
    # [Station] (or [[forecast]] latitude / longitude). zoom: 2 to 12.
    [[lightning]]
        enable = true
        zoom = 7

    # "Sun and Moon" (dashboard frame): sunrise / sunset and moonrise / moonset,
    # day length, phase, altitude chart. Computed by the weewx almanac (PyEphem) in
    # data/astro.json, for the latitude / longitude of [Station]
    # (or [[forecast]] latitude / longitude).
    [[astro]]
        enable = true

    # Units shown by default on all pages (data stay metric; conversion happens in
    # the browser). Each visitor can choose their own ("Settings → Units" menu,
    # remembered by their browser). Missing option: metric.
    [[units]]
        temperature = °C     # °C, °F
        wind = kmh           # km/h, m/s, mph, kn
        rain = mm            # mm, in
        rain_rate = mm/h     # mm/h, in/h
        pressure = hPa       # hPa, inHg, mmHg, kPa
        altitude = m         # m, ft
        snow = cm            # cm, in

    # Publication units of the extra parameters, per weewx unit group
    # (weewx unit names). Missing option: unit given below in the comment.
    # The temperature, speed, rain, rain rate, pressure, altitude and length (cm) groups
    # follow [[units]] (conversion in the browser) and are not set here.
    # A parameter can also have its own unit: "units" option of [[parameters]].
    [[unit_groups]]
        # group_distance = km                  # km, meter, mile
        # group_energy = watt_hour             # watt_hour, kilowatt_hour, mega_joule, watt_second
        # group_degree_day = degree_C_day      # degree_C_day, degree_F_day
        # group_interval = hour                # durations in minutes: hour, minute, second, day
        # group_deltatime = hour               # durations in seconds: hour, minute, second, day
        # group_pressurerate = mbar_per_hour   # mbar_per_hour, hPa_per_hour, inHg_per_hour, mmHg_per_hour, kPa_per_hour
        # (radiation W/m², soil moisture cb, illuminance lx, concentration µg/m³, voltage V,
        #  ppm: only one unit in weewx)

    # MeteoAlarm (EUMETNET) weather warnings: warnings of the national weather services
    # (Météo-France, MeteoSwiss, DWD, Aeronautica Militare…). weewx downloads the feed of
    # each country at most once per "cache" and publishes in data/warnings.json the yellow,
    # orange and red warnings in force or upcoming for each location below.
    # Dashboard: pills of the warnings in force at the top of the page (link to
    # vigilance.html, "Forecasts" → "Weather warnings" menu). No location: disabled.
    # One subsection per location (locations can be in different countries):
    #   title   = displayed name
    #   country = country of the MeteoAlarm feed: English name (france, switzerland, italy,
    #             germany, united-kingdom…) or ISO code (fr, ch, it, de, gb…)
    #   region  = CAP area code(s) of the feed (NUTS3 for France, e.g. FR825; EMMA_ID
    #             elsewhere, e.g. IT004), separated by commas
    #   area    = area name(s) of the feed (areaDesc, e.g. Haute-Savoie, Valle d'Aosta)
    #   latitude / longitude = point inside the area polygons (countries whose warnings
    #             only have polygons, e.g. Switzerland)
    #   without region, area or latitude / longitude: station coordinates
    [[meteoalarm]]
        enable = true
        # seconds between two downloads of a country (60 to 3600; 5 min by default)
        cache = 300
        # minimum level shown: 2 yellow, 3 orange, 4 red
        min_level = 2
        # timeout = 20: MeteoAlarm response timeout (s, 5 to 120)
        # [[[home]]]
        #     title = Sciez
        #     country = france
        #     area = Haute-Savoie
        # [[[geneva]]]
        #     title = Geneva
        #     country = switzerland
        #     latitude = 46.20
        #     longitude = 6.15
        # [[[aosta]]]
        #     title = Aosta Valley
        #     country = it
        #     region = IT004

    # Admin mode: parameters marked "admin = true" in [[parameters]] are only shown
    # to visitors who entered this password ("Settings → Admin" menu, remembered by
    # their browser until "Leave admin mode"). Only the SHA-256 hash of the password
    # is published (wxtime.js). Empty: admin mode disabled ("admin = true" parameters
    # are then shown to nobody).
    # WARNING: simple hiding on display. The measurements remain readable in the
    # published files (data/*.json, archive pages) and in the MQTT messages.
    # Tip: put the password in weewx.conf ([[WeewxLive]] [[[LiveJSON]]] [[[[admin]]]]).
    [[admin]]
        password = ""

    # Order of the dashboard frames (top to bottom). Identifiers:
    #   parameters (station measurements), forecast (forecasts), maps (radar and
    #   satellite), astro (Sun and Moon), climate (this day and this month over the years).
    # A forgotten frame is added at the end. Each visitor can then change this order
    # and that of the measurement panels, and hide items ("Rearrange" button of the
    # dashboard, choices remembered by their browser).
    [[dashboard]]
        order = parameters, forecast, maps, astro, climate

    # Open-Meteo forecasts: downloaded by weewx (at most once per "cache") and
    # published in data/forecast.json; the browser only calls Open-Meteo as a fallback.
    [[forecast]]
        enable = true
        # models offered in the drop-down list of the "Forecasts" card (at most 5,
        # Open-Meteo identifiers); each is downloaded at most once per "cache":
        #   best_match (best model for the location), icon_seamless (DWD ICON),
        #   meteofrance_seamless (AROME / ARPEGE, 4 days), ecmwf_ifs025, gfs_seamless,
        #   ukmo_seamless, gem_seamless…
        models = best_match, icon_seamless, meteofrance_seamless, ecmwf_ifs025, gfs_seamless
        # model shown by default (the browser then remembers the visitor's choice)
        model = best_match
        # range (days, 1 to 16; limited by each model's range)
        days = 7
        # cache duration in seconds (60 to 86400, default 1 hour). weewx downloads the forecasts
        # at most once per period and publishes them in data/forecast.json; browsers
        # also keep them in cache for this duration.
        cache = 3600
        # timeout = 15: Open-Meteo response timeout (s, 2 to 60)
        # latitude / longitude: by default those of [Station] in weewx.conf (also
        # used by Sun and Moon, the maps, the meteogram and the ensembles)
        # latitude = 48.11
        # longitude = -1.68

    # Meteogram (meteogram.html page, "Forecasts" → "Meteogram" menu): hourly forecast
    # of an Open-Meteo model at ground level and aloft (pressure levels),
    # downloaded by weewx at most once per "cache" (data/meteogram.json).
    [[meteogram]]
        enable = true
        # models offered in the drop-down list of the page (at most 5, Open-Meteo
        # identifiers); each is downloaded at most once per "cache":
        #   icon_seamless (DWD ICON-D2, then ICON-EU, then global), meteofrance_seamless
        #   (AROME, then ARPEGE), ecmwf_ifs025, gfs_seamless, ukmo_seamless, best_match,
        #   gem_seamless, meteoswiss_icon_ch2…
        models = icon_seamless, meteofrance_seamless, ecmwf_ifs025, gfs_seamless, ukmo_seamless
        # model shown by default (otherwise the first of the list; the browser then
        # remembers the visitor's choice)
        model = icon_seamless
        # range (days, 1 to 16; ICON-D2: 2 days, ICON-EU: 5 days)
        days = 4
        # cache duration in seconds (600 to 86400, default 1 h)
        cache = 3600
        # top of the cross-sections (m): clouds (3000 to 16000), temperature / wind (1500 to 12000)
        top_clouds = 12000
        top_temperature = 4500
        # timeout = 30: Open-Meteo response timeout (s, 5 to 120)
        # latitude / longitude: by default those of [[forecast]] or [Station]

    # Open-Meteo ensemble forecasts (ensembles.html page, "Forecasts" →
    # "Ensembles" menu): weewx downloads each model at most once per "cache" and
    # publishes the members in data/ensembles.json; the browser does the calculations.
    [[ensembles]]
        enable = true
        # displayed models, in this order (identifiers of the Open-Meteo Ensemble API,
        # models= parameter):
        #   ecmwf_ifs025 (ECMWF ENS, 51 members, 15 d)
        #   ecmwf_aifs025_ensemble (ECMWF AIFS, AI, 51, 15 d)
        #   gfs_seamless (NOAA GEFS, 31, 16 d and more)
        #   icon_seamless_eps (DWD ICON EPS, 40, 7.5 d); icon_eu_eps (5 d), icon_d2_eps (2 d)
        #   gem_global (ECCC GEPS, 21, 16 d)
        #   google_weathernext2_ensemble (Google WeatherNext 2, AI, 64, 15 d)
        #   ukmo_global_ensemble_20km (Met Office, 18, 8 d), ukmo_uk_ensemble_2km (5 d)
        #   bom_access_global_ensemble (BOM, 18, 10 d)
        #   ncep_gefs025, ncep_gefs05, ncep_aigefs025 (NOAA), ecmwf_ifs_europe_ensemble,
        #   meteoswiss_icon_ch1, meteoswiss_icon_ch2…
        #   full list: https://open-meteo.com/en/docs/ensemble-api
        models = ecmwf_ifs025, gfs_seamless, icon_seamless_eps, gem_global, google_weathernext2_ensemble
        # downloaded range (days, 1 to 35; limited by each model)
        days = 16
        # offered horizons (buttons, days) and horizon shown by default (otherwise the first)
        horizons = 3, 7, 10, 16
        default_horizon = 10
        # one point every "step" hours on the charts (1, 2, 3, 4 or 6)
        step = 1
        # cache duration in seconds (1800 to 86400, default 3 h; models are updated
        # every 6 to 12 h)
        cache = 10800
        # mm: "measurable" rain (chance of rain)
        rain_threshold = 0.2
        # timeout = 30: Open-Meteo response timeout (s, 5 to 120)
        # latitude / longitude: by default those of [[forecast]] or [Station]

    # Basemap of the RainViewer (radar) and EUMETSAT (satellite) maps; not used by Windy.
    #   osm         : OpenStreetMap (default, no key; darkened in dark theme)
    #   esri        : Esri light grey / dark grey, place names above the images
    #   opentopomap : OpenTopoMap (relief)
    #   carto       : CARTO light / dark; API key required since 2026 (free
    #                 for personal use: https://carto.com/basemaps) -> key = …
    [[basemap]]
        provider = osm
        key = ""

    # Precipitation radar
    #   provider = windy      : embedded Windy.com map (iframe, no key; animation
    #                           started with the ▶ button of the map)
    #   provider = rainviewer : automatic RainViewer animation (last 2 hours, zoom max. 7)
    [[radar]]
        enable = true
        provider = windy
        # Windy: layer and product (e.g. radar/radar, satellite/satellite, rain/ecmwf, wind/ecmwf)
        windy_overlay = radar
        windy_product = radar
        # or: full address copied from the generator https://embed.windy.com
        # (takes precedence over the settings above)
        windy_url = ""
        # map zoom (1 to 12; RainViewer: 7 at most)
        zoom = 7
        # RainViewer: number of frames (2 to 13) and delay between two frames (ms, 100 to 5000)
        frames = 13
        frame_delay = 500

    # Satellite images
    #   provider = windy    : embedded Windy.com map (iframe, satellite layer)
    #   provider = eumetsat : automatic EUMETSAT EUMETView animation (WMS, CC BY 4.0)
    [[satellite]]
        enable = true
        provider = windy
        windy_overlay = satellite
        windy_product = satellite
        # or: full address copied from https://embed.windy.com (takes precedence)
        windy_url = ""
        # --- settings used with provider = eumetsat ---
        url = https://view.eumetsat.int/geoserver/wms
        # offered layers: name|label (the first one is shown by default); without a
        # label, the one of the chosen language for these two layers (Infrared, True colour)
        layers = mtg_fd:ir105_hrfi, mtg_fd:rgb_truecolour
        # map zoom (1 to 12, also for Windy)
        zoom = 5
        # number of frames (2 to 36) and minutes between two frames (5 to 60)
        frames = 12
        step_minutes = 10
        # delay before EUMETSAT makes the images available (minutes, 0 to 240)
        latency_minutes = 30
        # delay between two frames of the animation (ms, 100 to 5000)
        frame_delay = 400

[CheetahGenerator]
    search_list_extensions = user.livejson.LiveJSON
    encoding = utf8
    [[ToDate]]
        # Dashboard: structure adapted to [[parameters]]
        [[[index]]]
            template = index.html.tmpl
        [[[history]]]
            template = data/history.json.tmpl
        [[[config]]]
            template = config.json.tmpl
        # station time and default units, for all page scripts
        [[[wxtime]]]
            template = wxtime.js.tmpl
        # texts of the chosen language (lang/*.conf), for all page scripts
        [[[i18n]]]
            template = i18n.js.tmpl
        # translated pages (texts of the language file)
        [[[detail]]]
            template = detail.html.tmpl
        [[[extremes_page]]]
            template = extremes.html.tmpl
        [[[ensembles_page]]]
            template = ensembles.html.tmpl
        [[[meteogram_page]]]
            template = meteogram.html.tmpl
        [[[units_page]]]
            template = units.html.tmpl
        [[[admin_page]]]
            template = admin.html.tmpl
        [[[webcam_page]]]
            template = webcam.html.tmpl
        [[[vigilance_page]]]
            template = vigilance.html.tmpl
        # This day and this month over the years (daily summaries; fast)
        [[[climate]]]
            template = data/climate.json.tmpl
            stale_age = 900
        # "Extremes" page (records, rankings, frost / dry / wet spells)
        [[[extremes]]]
            template = data/extremes.json.tmpl
            stale_age = 3600
        # Sun and Moon (weewx almanac), at each archive
        [[[astro]]]
            template = data/astro.json.tmpl
        # Open-Meteo forecasts (cache handled by the extension, see [[forecast]] cache)
        [[[forecast]]]
            template = data/forecast.json.tmpl
        # MeteoAlarm warnings, at each archive (download at most once per [[meteoalarm]] cache)
        [[[warnings]]]
            template = data/warnings.json.tmpl
        # Meteogram and ensemble forecasts: recomputed at most every 30 min,
        # downloads limited by [[meteogram]] cache and [[ensembles]] cache
        [[[meteogram]]]
            template = data/meteogram.json.tmpl
            stale_age = 1800
        [[[ensembles]]]
            template = data/ensembles.json.tmpl
            stale_age = 1800
        # Detail and period pages: 24 h at each archive, the others at most
        # every stale_age seconds
        [[[p24h]]]
            template = data/p24h.json.tmpl
        [[[p7d]]]
            template = data/p7d.json.tmpl
            stale_age = 1800
        [[[p30d]]]
            template = data/p30d.json.tmpl
            stale_age = 3600
        [[[p365d]]]
            template = data/p365d.json.tmpl
            stale_age = 3600
        # 730 days (2 years), detail pages per parameter
        [[[p730d]]]
            template = data/p730d.json.tmpl
            stale_age = 3600
    # Archives: one page per day, per month, per year (see [LiveJSON] [[archives]])
    [[SummaryByDay]]
        [[[day]]]
            template = archive/day-%Y-%m-%d.html.tmpl
    [[SummaryByMonth]]
        [[[month]]]
            template = archive/month-%Y-%m.html.tmpl
        [[[climato]]]
            template = archive/climato-%Y-%m.html.tmpl
    [[SummaryByYear]]
        [[[year]]]
            template = archive/year-%Y.html.tmpl
        [[[climato_year]]]
            template = archive/climato-%Y.html.tmpl

[CopyGenerator]
    # copy_always: an update of the skin is republished automatically
    copy_always = style.css, app.js, detail.js, nav.js, minichart.js, extras.js, climate.js, astro.js, archive.js, climato.js, layout.js, extremes.js, ensembles.js, meteogram.js, wxicons.js, units.js, admin.js, webcam.js, warnings.js, img, vendor

[Generators]
    # weewx Cheetah generator + [[archives]] option (day / month / year / climato pages)
    generator_list = user.livejson.LiveCheetahGenerator, weewx.reportengine.CopyGenerator
