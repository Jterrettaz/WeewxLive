<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Météogramme</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23eda100'/%3E%3C/svg%3E">
</head>
<body class="detail mg-page">
  <header class="top">
    <div class="brand">
      <img class="brand-logo" id="brand-logo" alt="" hidden>
      <div class="brand-text">
        <h1 id="station-name">Station météo</h1>
        <p class="subtitle" id="subtitle">weewx</p>
      </div>
    </div>
  </header>
  <nav id="menu" class="menu" aria-label="Pages"></nav>

  <main class="page" id="page">
    <section class="page-head">
      <div>
        <h2 class="p-title"><span class="sw" style="background:var(--wind)"></span>Météogramme</h2>
        <p id="mg-sub" class="p-last">Open-Meteo</p>
      </div>
    </section>
    <div class="mg-bar" id="mg-bar"></div>
    <div id="mg-root"><p class="muted">Chargement du météogramme…</p></div>
  </main>

  <footer class="foot">Prévisions <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)<span id="gen"></span></footer>

  <div id="tip" class="tip" hidden></div>

  <script src="nav.js"></script>
  <script src="minichart.js"></script>
  <script src="wxicons.js"></script>
  <script src="meteogram.js"></script>
</body>
</html>
