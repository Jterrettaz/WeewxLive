    ###############################################################################
    # Language, date formats, day and month names. Used by the Python module (archive page
    # titles) and by the pages (Intl, toLocaleString).
    [[Locale]]
        # <html> lang attribute
        "html_lang"        = "it"
        # numbers and dates in the pages (Intl); en-US gives US conventions
        "intl_locale"      = "it-IT"
        # list, Monday to Sunday
        "weekdays"         = lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica
        # list
        "months"           = gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre
        # day page title
        "date_long"        = "{weekday} {day} {month} {year}"
        "month_year"       = "{month} {year}"
        "year"             = "Anno {year}"
        "day_month"        = "{day} {month}"
        # first day of the month
        "day_month_first"  = "1º {month}"
        # "Junes", "of June"
        "of_month"         = "di {month}"
