###############################################################################
#  File di lingua --- skin WeewxLive (weewx-live)                             #
#  Italiano                                                                   #
###############################################################################
#
# Testi delle pagine di weewx-live (dalla versione 2.01). Traduzione proposta, da
# rileggere.
#
# Uso (direttive weewx): un file per lingua in skins/WeewxLive/lang/, la lingua
# si sceglie con l'opzione "lang" del report, per esempio in weewx.conf:
#     [StdReport]
#         [[WeewxLive]]
#             lang = it
# weewx unisce questo file alla configurazione dello skin.
#
# Convenzioni:
#  - Le chiavi sono in inglese e identiche in tutte le lingue; si traduce solo il
#    valore a destra di "=".
#  - {nome}: valore inserito dal codice (numero, data, unità…); da lasciare tale
#    e quale, al posto giusto nella frase.
#  - Valori tra virgolette doppie (virgole ammesse); liste senza virgolette.
#  - Testo mancante: viene mostrata la chiave inglese (pagine: elenco in
#    window.WXL_MISSING, console del browser).
#  - I commenti delle sezioni sono in inglese (come in en.conf).
#
[Units]

    [[Ordinates]]
        # Wind directions (16 sectors), then no direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/D

