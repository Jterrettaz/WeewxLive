###############################################################################
#  Localization file --- WeewxLive skin (weewx-live)                          #
#  English                                                                    #
###############################################################################
#
# Texts of the weewx-live pages (since version 1.98). Suggested translation, to be
# reviewed.
#
# Usage (weewx guidelines): one file per language in skins/WeewxLive/lang/, the
# language is chosen with the report option "lang", for example in weewx.conf:
#     [StdReport]
#         [[WeewxLive]]
#             lang = en
# weewx merges this file into the skin configuration; templates read the texts
# with $gettext("key") or $pgettext("Context", "key").
#
# Conventions:
#  - Keys are in English and identical in every language; only the value on the
#    right of "=" is translated.
#  - {name}: value inserted by the code (number, date, unit…); keep it as is, at
#    the right place in the sentence.
#  - Values in double quotes (commas allowed); lists without quotes.
#  - Missing text: the English key is shown (pages: list in window.WXL_MISSING,
#    browser console).
#  - New language: copy en.conf to <code>.conf (e.g. de.conf), translate the values,
#    then lang = <code> in weewx.conf.
#  - No "unit_system" option here: units are set in [LiveJSON] [[units]] and by
#    each visitor ("Settings → Units" page).
#
[Units]

    [[Ordinates]]
        # Wind directions (16 sectors), then no direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

