###############################################################################
#  Fichier de langue --- skin WeewxLive (weewx-live)                          #
#  Français                                                                   #
###############################################################################
#
# Textes des pages de weewx-live (depuis la version 1.98). Langue par défaut du skin :
# skin.conf, lang = fr.
#
# Utilisation (directives weewx) : un fichier par langue dans skins/WeewxLive/lang/,
# langue choisie par l'option « lang » du rapport, par exemple dans weewx.conf :
#     [StdReport]
#         [[WeewxLive]]
#             lang = fr
# weewx fusionne ce fichier dans la configuration du skin ; les gabarits lisent
# les textes par $gettext("clé") ou $pgettext("Contexte", "clé").
#
# Conventions :
#  - Les clés sont en anglais et identiques dans toutes les langues ; seule la
#    valeur à droite du signe « = » se traduit.
#  - {nom} : valeur insérée par le code (nombre, date, unité…) ; à garder telle
#    quelle, à la place qui convient dans la phrase.
#  - Valeurs entre guillemets (virgules permises) ; listes sans guillemets.
#  - Texte absent : la clé anglaise est affichée (pages : liste dans window.WXL_MISSING,
#    console du navigateur).
#  - Nouvelle langue : copier en.conf sous le nom <code>.conf (ex. de.conf), traduire les
#    valeurs, puis lang = <code> dans weewx.conf.
#  - Pas d'option « unit_system » ici : les unités sont réglées dans [LiveJSON]
#    [[units]] et par chaque visiteur (page « Réglages → Unités »).
#
[Units]

    [[Ordinates]]
        # Directions du vent (16 secteurs), puis absence de direction
        # Ouest : O (SO, OSO, ONO, NO…)
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Labels]

    # Titres par défaut des mesures (option « title » de [[parameters]] absente)
    [[Generic]]
        outTemp                = "Température"
        wind                   = "Vent"
        windDir                = "Direction du vent"
        rain                   = "Pluie"
        outHumidity            = "Humidité relative"
        barometer              = "Pression"

        # Autres types weewx (paramètres ajoutés)
        appTemp                = "Température ressentie"
        dewpoint               = "Point de rosée"
        heatindex              = "Indice de chaleur"
        humidex                = "Humidex"
        windchill              = "Refroidissement éolien"
        inTemp                 = "Température intérieure"
        inHumidity             = "Humidité intérieure"
        pressure               = "Pression station"
        altimeter              = "Altimètre"
        windSpeed              = "Vitesse du vent"
        windGust               = "Rafales"
        windGustDir            = "Direction des rafales"
        windrun                = "Parcours du vent"
        rainRate               = "Intensité de pluie"
        ET                     = "Évapotranspiration"
        radiation              = "Rayonnement solaire"
        UV                     = "Indice UV"
        cloudbase              = "Base des nuages"
        snow                   = "Neige"
        snowDepth              = "Hauteur de neige"
        lightning_strike_count = "Nombre d'éclairs"
        lightning_distance     = "Distance des éclairs"
        luminosity             = "Luminosité"
        pm1_0                  = "Particules PM1"
        pm2_5                  = "Particules PM2,5"
        pm10_0                 = "Particules PM10"
        co2                    = "CO₂"
