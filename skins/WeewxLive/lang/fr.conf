    ###############################################################################
    # Langue, formats de date et noms des jours et des mois. Utilisé par le module Python
    # (titres des pages d'archives) et par les pages (Intl, toLocaleString).
    [[Locale]]
        # attribut lang de <html>
        "html_lang"        = "fr"
        # nombres et dates des pages (Intl)
        "intl_locale"      = "fr-FR"
        # liste, du lundi au dimanche
        "weekdays"         = lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche
        # liste
        "months"           = janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre
        # titre d'une page « jour »
        "date_long"        = "{weekday} {day} {month} {year}"
        "month_year"       = "{month} {year}"
        "year"             = "Année {year}"
        "day_month"        = "{day} {month}"
        # premier jour du mois
        "day_month_first"  = "1er {month}"
        # « des mois de juin »
        "of_month"         = "de {month}"
        # élision devant une voyelle (août, avril, octobre)
        "of_month_vowel"   = "d'{month}"
        # « à 14:05 »
        "time_at"          = "à {time}"
        "day_at_time"      = "{day} à {time}"
        "on_day"           = "le {day}"
        "on_day_at_time"   = "le {day} à {time}"
        "range_from_to"    = "du {start} au {stop}"
        # graduations horaires « 06 h »
        "hour_suffix"      = "{h} h"
        "duration_min"     = "{m} min"
        "duration_h_min"   = "{h} h {m} min"
        "duration_d_h"     = "{d} j {h} h"
