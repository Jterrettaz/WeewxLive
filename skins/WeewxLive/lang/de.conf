    ###############################################################################
    # Language, date formats, day and month names. Used by the Python module (archive page
    # titles) and by the pages (Intl, toLocaleString).
    [[Locale]]
        # <html> lang attribute
        "html_lang"        = "de"
        # numbers and dates in the pages (Intl); en-US gives US conventions
        "intl_locale"      = "de-DE"
        # list, Monday to Sunday
        "weekdays"         = Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag
        # list
        "months"           = Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember
        # day page title
        "date_long"        = "{weekday}, {day}. {month} {year}"
        "month_year"       = "{month} {year}"
        "year"             = "Jahr {year}"
        "day_month"        = "{day}. {month}"
        # first day of the month
        "day_month_first"  = "1. {month}"
        # "Junes", "of June"
        "of_month"         = "{month}"
        # French elision only
        "of_month_vowel"   = "{month}"
        # « à 14:05 »
        "time_at"          = "um {time}"
        "day_at_time"      = "{day} um {time}"
        "on_day"           = "am {day}"
        "on_day_at_time"   = "am {day} um {time}"
        "range_from_to"    = "vom {start} bis {stop}"
        # hourly axis ticks
        "hour_suffix"      = "{h} Uhr"
