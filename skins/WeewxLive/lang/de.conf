###############################################################################
#  Sprachdatei --- Skin WeewxLive (weewx-live)                                #
#  Deutsch                                                                    #
###############################################################################
#
# Texte der weewx-live-Seiten (seit Version 2.01). Übersetzungsvorschlag, bitte
# prüfen.
#
# Verwendung (weewx-Richtlinien): eine Datei pro Sprache in skins/WeewxLive/lang/,
# die Sprache wird mit der Berichtsoption "lang" gewählt, z. B. in weewx.conf:
#     [StdReport]
#         [[WeewxLive]]
#             lang = de
# weewx führt diese Datei mit der Skin-Konfiguration zusammen.
#
# Konventionen:
#  - Die Schlüssel sind englisch und in allen Sprachen gleich; nur der Wert rechts
#    vom "=" wird übersetzt.
#  - {name}: vom Code eingesetzter Wert (Zahl, Datum, Einheit…); unverändert lassen,
#    an der passenden Stelle im Satz.
#  - Werte in doppelten Anführungszeichen (Kommas erlaubt); Listen ohne.
#  - Fehlender Text: der englische Schlüssel wird angezeigt (Seiten: Liste in
#    window.WXL_MISSING, Browserkonsole).
#  - Die Kommentare der Abschnitte sind englisch (wie in en.conf).
#
[Units]

    [[Ordinates]]
        # Wind directions (16 sectors), then no direction
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, –

