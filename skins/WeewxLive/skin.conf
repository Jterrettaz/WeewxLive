###############################################################################
# WeewxLive — tableau de bord temps réel (MQTT ou archive weewx)               #
#                                                                             #
# Génère à la racine du dossier HTML_ROOT du rapport (sous-dossier possible :  #
# HTML_ROOT = public_html/meteo dans [StdReport] [[WeewxLive]] de weewx.conf) : #
#   index.html         tableau de bord (gabarit, à chaque archive)            #
#   detail.html, extremes.html, *.js, style.css, img/, vendor/  (copiés)      #
#   config.json        configuration de la page                              #
#   data/history.json  séries 24 h + extrêmes du jour (à chaque archive)      #
#   data/p24h|p7d|p30d|p365d|p730d.json  pages de détail                      #
#   data/climate.json  ce jour / ce mois au fil des ans                       #
#   data/extremes.json records de la station (page « Extrêmes »)              #
#   data/forecast.json prévisions Open-Meteo (cache)                          #
#   data/ensembles.json prévisions d'ensemble Open-Meteo (cache)              #
#   data/astro.json    soleil et lune du jour (almanach weewx)                #
#   archive/day-AAAA-MM-JJ.html, month-AAAA-MM.html, year-AAAA.html            #
#                      archives par jour, mois, année (option [[archives]])   #
#   archive/climato-AAAA-MM.html, climato-AAAA.html  climatologie             #
#   ensembles.html     prévisions d'ensemble (data/ensembles.json)             #
# Le rapport FTP/RSYNC de weewx les envoie ensuite sur le serveur public.     #
#                                                                             #
# ATTENTION : une réinstallation de l'extension remplace ce fichier. Pour     #
# conserver vos réglages, recopiez-les dans weewx.conf, [StdReport]            #
# [[WeewxLive]] [[[LiveJSON]]] … (voir README).                               #
###############################################################################

SKIN_NAME = WeewxLive
SKIN_VERSION = 1.55

[LiveJSON]
    # Profondeur de l'historique (heures, 1 à 72)
    hours = 24
    data_binding = wx_binding
    # Nom affiché (vide = [Station] location de weewx.conf)
    station_name = ""
    # Logo affiché à gauche du nom de la station (vide = pas de logo).
    # Fichier à placer dans skins/WeewxLive/img/ (ex. img/logo.png, copié avec la page)
    # ou adresse complète https://…
    logo = ""
    logo_alt = ""          # texte alternatif (vide : logo décoratif)
    logo_height = 48       # hauteur affichée, en pixels
    # JSON indenté (débogage)
    pretty = false
    # Rechargement complet du tableau de bord, en secondes (0 = jamais). Utile pour
    # prendre en compte un changement de skin.conf ; interrompt brièvement le temps réel.
    page_refresh = 300

    [[mqtt]]
        # true : valeurs en temps réel par MQTT.
        # false : pas de MQTT ; le tableau de bord se met à jour à chaque archive weewx
        # (data/history.json relu toutes les archive_poll secondes, affiché dès qu'une
        # nouvelle archive est publiée). Les réglages ci-dessous sont alors ignorés.
        enable = true
        archive_poll = 60
        # Broker vu depuis le NAVIGATEUR des visiteurs : il doit être joignable
        # depuis internet, en WebSocket sécurisé si la page est en HTTPS.
        url = wss://broker.example.org:8884/mqtt
        topic = weather/loop
        # clés du message MQTT contenant la température d'il y a 1 h et 24 h
        # (variations sur 1 h et 24 h du panneau Température)
        temp_1h_key = OutTemp-1h_C
        temp_24h_key = OutTemp-24h_C
        # Utilisateur en LECTURE SEULE : ces identifiants sont publics.
        username = ""
        password = ""

    # ------------------------------------------------------------------
    # Paramètres affichés sur le tableau de bord, dans les pages de détail et le
    # menu « Données », dans l'ordre ci-dessous. Une sous-section par paramètre :
    #   title     = titre affiché
    #   column    = nom de la colonne SQLite (table archive de weewx)
    #   mqtt      = nom de la mesure dans les messages MQTT (avant le suffixe d'unité :
    #               outTemp pour outTemp_C ; la casse est ignorée)
    #   aggregate = min-max | max | sum
    #               min-max : valeur, minimum et maximum (température, humidité…)
    #               max     : valeur et maximum (indice UV, rafales…)
    #               sum     : cumul (pluie, évapotranspiration…), barres + courbe de cumul
    #   unit, decimals, hint, color (variable CSS, ex. --temp) : facultatifs
    #   enable = false : masque le paramètre
    # Les 7 paramètres standard (outTemp, wind, windDir, rain, radiation, outHumidity,
    # barometer) gardent leur panneau spécialisé tant que leur agrégat n'est pas changé.
    # Supprimer une sous-section la retire de l'affichage (dans weewx.conf, qui ne peut
    # qu'ajouter ou modifier : enable = false). Sans aucune sous-section : les 7 standard.
    # order = id1, id2, … (facultatif) : ces paramètres d'abord, dans cet ordre, puis les
    # autres. Utile dans weewx.conf, où les sections ajoutées se placent après celles-ci.
    # ------------------------------------------------------------------
    [[parameters]]
        # order = outTemp, wind, windDir, rain, radiation, outHumidity, barometer
        [[[outTemp]]]
            title = Température
            column = outTemp
            mqtt = outTemp
            aggregate = min-max
        [[[wind]]]
            title = Vent
            column = windSpeed
            mqtt = windSpeed
        [[[windDir]]]
            title = Direction du vent
            column = windDir
            mqtt = windDir
        [[[rain]]]
            title = Pluie
            column = rain
            mqtt = rain
            aggregate = sum
        [[[radiation]]]
            title = Rayonnement solaire
            column = radiation
            mqtt = radiation
            aggregate = min-max
        [[[outHumidity]]]
            title = Humidité relative
            column = outHumidity
            mqtt = outHumidity
            aggregate = min-max
        [[[barometer]]]
            title = Pression
            column = barometer
            mqtt = barometer
            aggregate = min-max
        # Exemples de paramètres supplémentaires (Vantage Pro 2 avec capteur UV, ET) :
        # [[[UV]]]
        #     title = Indice UV
        #     column = UV
        #     mqtt = UV
        #     aggregate = max
        #     decimals = 1
        # [[[ET]]]
        #     title = Évapotranspiration
        #     column = ET
        #     mqtt = ET
        #     aggregate = sum
        #
        # Panneau groupé : plusieurs mesures dans un même panneau (tableau de bord) et
        # sur une même page de détail (une courbe par mesure). Une sous-section qui
        # contient elle-même des sous-sections [[[[…]]]] est un groupe :
        #   title, aggregate (min-max ou max, commun aux mesures), unit, decimals, hint ;
        #   puis une sous-section par mesure : title, column, mqtt (+ unit, decimals, color).
        # Exemple : particules fines (colonnes pm1_0, pm2_5, pm10_0 du schéma étendu weewx)
        # [[[particules]]]
        #     title = Particules fines
        #     aggregate = min-max
        #     unit = µg/m³
        #     [[[[pm1_0]]]]
        #         title = PM1
        #         column = pm1_0
        #         mqtt = pm1_0
        #     [[[[pm2_5]]]]
        #         title = PM2.5
        #         column = pm2_5
        #         mqtt = pm2_5
        #     [[[[pm10_0]]]]
        #         title = PM10
        #         column = pm10_0
        #         mqtt = pm10_0

    # Archives (menu Données → Archives), avec sélecteur de date en haut de page :
    #   archive/day-AAAA-MM-JJ.html  tous les panneaux du tableau de bord pour une journée
    #   archive/month-AAAA-MM.html   statistiques et graphiques de chaque paramètre pour un mois
    #   archive/year-AAAA.html       idem pour une année
    # La page de la période en cours est régénérée à chaque archive ; les périodes passées
    # une seule fois.
    [[archives]]
        # false : pages du type correspondant non générées
        day = true
        month = true
        year = true
        # tableaux climatologiques mensuels et annuels (archive/climato-AAAA-MM.html et
        # climato-AAAA.html, menu « Climatologie »)
        climato = true
        # nombre de pages « jour » produites, en remontant depuis aujourd'hui (0 = toutes
        # depuis le début des données : la première génération peut alors être longue ;
        # ex. 365 pour limiter aux 365 derniers jours)
        days = 0

    # Page « Extrêmes » (menu Données)
    [[extremes]]
        # nombre de lignes de chaque classement
        top = 10
        # pluie journalière minimale (mm, valeur incluse) d'un jour de « période de pluie »
        rain_day_threshold = 0.2
        # fraction (0 à 1) du jour couverte par des mesures pour qu'il soit pris en compte
        # (moyennes journalières, mois complets, périodes de sécheresse / pluie)
        min_day_coverage = 0.75

    # « Soleil et Lune » (tableau de bord, avant les prévisions) : lever / coucher du soleil
    # et de la lune, durée du jour, phase, graphique des hauteurs. Calculé par l'almanach de
    # weewx (PyEphem) dans data/astro.json, pour la latitude / longitude de [Station]
    # (ou [[forecast]] latitude / longitude).
    [[astro]]
        enable = true

    # Prévisions Open-Meteo : téléchargées par weewx (au plus une fois par « cache ») et
    # publiées dans data/forecast.json ; le navigateur n'appelle Open-Meteo qu'en secours.
    [[forecast]]
        enable = true
        # best_match = meilleur modèle disponible pour le lieu
        model = best_match
        days = 7
        # durée du cache en secondes (défaut : 1 heure). weewx télécharge les prévisions
        # au plus une fois par période et les publie dans data/forecast.json ; les
        # navigateurs les gardent aussi en cache pendant cette durée.
        cache = 3600
        # latitude / longitude : par défaut celles de [Station] dans weewx.conf
        # latitude = 48.11
        # longitude = -1.68

    # Prévisions d'ensemble Open-Meteo (page ensembles.html, menu « Prévisions » →
    # « Ensembles ») : weewx télécharge chaque modèle au plus une fois par « cache » et
    # publie les membres dans data/ensembles.json ; le navigateur fait les calculs.
    [[ensembles]]
        enable = true
        # modèles affichés, dans cet ordre (identifiants de l'API Ensemble d'Open-Meteo,
        # paramètre models=) :
        #   ecmwf_ifs025 (ECMWF ENS, 51 membres, 15 j)
        #   ecmwf_aifs025_ensemble (ECMWF AIFS, IA, 51, 15 j)
        #   gfs_seamless (NOAA GEFS, 31, 16 j et plus)
        #   icon_seamless_eps (DWD ICON EPS, 40, 7,5 j) ; icon_eu_eps (5 j), icon_d2_eps (2 j)
        #   gem_global (ECCC GEPS, 21, 16 j)
        #   google_weathernext2_ensemble (Google WeatherNext 2, IA, 64, 15 j)
        #   ukmo_global_ensemble_20km (Met Office, 18, 8 j), ukmo_uk_ensemble_2km (5 j)
        #   bom_access_global_ensemble (BOM, 18, 10 j)
        #   ncep_gefs025, ncep_gefs05, ncep_aigefs025 (NOAA), ecmwf_ifs_europe_ensemble,
        #   meteoswiss_icon_ch1, meteoswiss_icon_ch2…
        #   liste complète : https://open-meteo.com/en/docs/ensemble-api
        models = ecmwf_ifs025, gfs_seamless, icon_seamless_eps, gem_global, google_weathernext2_ensemble
        # échéance téléchargée (jours ; limitée par chaque modèle)
        days = 16
        # horizons proposés (boutons) et horizon affiché par défaut (jours)
        horizons = 3, 7, 10, 16
        default_horizon = 3
        # un point toutes les « step » heures sur les graphiques (1, 2, 3, 4 ou 6)
        step = 3
        # durée du cache en secondes (défaut 3 h ; les modèles sont mis à jour toutes les
        # 6 à 12 h)
        cache = 10800
        # mm : pluie « mesurable » (risque de pluie)
        rain_threshold = 0.2
        # latitude / longitude : par défaut celles de [[forecast]] ou de [Station]

    # Radar précipitations
    #   provider = windy      : carte Windy.com intégrée (iframe, sans clé ; animation
    #                           lancée par le bouton ▶ de la carte)
    #   provider = rainviewer : animation RainViewer automatique (2 dernières heures, zoom max. 7)
    [[radar]]
        enable = true
        provider = windy
        # Windy : couche et produit (ex. radar/radar, satellite/satellite, rain/ecmwf, wind/ecmwf)
        windy_overlay = radar
        windy_product = radar
        # ou : adresse complète copiée depuis le générateur https://embed.windy.com
        # (prioritaire sur les réglages ci-dessus)
        windy_url = ""
        zoom = 7
        frames = 13
        frame_delay = 500

    # Images satellite
    #   provider = windy    : carte Windy.com intégrée (iframe, couche satellite)
    #   provider = eumetsat : animation EUMETSAT EUMETView automatique (WMS, CC BY 4.0)
    [[satellite]]
        enable = true
        provider = windy
        windy_overlay = satellite
        windy_product = satellite
        # ou : adresse complète copiée depuis https://embed.windy.com (prioritaire)
        windy_url = ""
        # --- réglages utilisés avec provider = eumetsat ---
        url = https://view.eumetsat.int/geoserver/wms
        # couches proposées : nom|libellé (la première est affichée par défaut)
        layers = "mtg_fd:ir105_hrfi|Infrarouge", "mtg_fd:rgb_truecolour|Couleurs vraies"
        zoom = 5
        frames = 12
        step_minutes = 10
        # délai de mise à disposition des images par EUMETSAT
        latency_minutes = 30
        frame_delay = 400

[CheetahGenerator]
    search_list_extensions = user.livejson.LiveJSON
    encoding = utf8
    [[ToDate]]
        # Tableau de bord : structure adaptée à [[parameters]]
        [[[index]]]
            template = index.html.tmpl
        [[[history]]]
            template = data/history.json.tmpl
        [[[config]]]
            template = config.json.tmpl
        # Ce jour et ce mois au fil des ans (résumés journaliers ; rapide)
        [[[climate]]]
            template = data/climate.json.tmpl
            stale_age = 900
        # Page « Extrêmes » (records, classements, périodes de gel / sécheresse / pluie)
        [[[extremes]]]
            template = data/extremes.json.tmpl
            stale_age = 3600
        # Soleil et Lune (almanach weewx), à chaque archive
        [[[astro]]]
            template = data/astro.json.tmpl
        # Prévisions Open-Meteo (cache géré par l'extension, voir [[forecast]] cache)
        [[[forecast]]]
            template = data/forecast.json.tmpl
        # Prévisions d'ensemble (cache géré par l'extension, voir [[ensembles]] cache)
        [[[ensembles]]]
            template = data/ensembles.json.tmpl
            stale_age = 1800
        # Pages de détail : 24 h à chaque archive, les autres au plus toutes les
        # stale_age secondes
        [[[p24h]]]
            template = data/p24h.json.tmpl
        [[[p7d]]]
            template = data/p7d.json.tmpl
            stale_age = 1800
        [[[p30d]]]
            template = data/p30d.json.tmpl
            stale_age = 3600
        [[[p365d]]]
            template = data/p365d.json.tmpl
            stale_age = 3600
        # 730 jours (2 ans), toutes les pages de détail
        [[[p730d]]]
            template = data/p730d.json.tmpl
            stale_age = 3600
    # Archives : une page par journée, par mois, par année (voir [LiveJSON] [[archives]])
    [[SummaryByDay]]
        [[[day]]]
            template = archive/day-%Y-%m-%d.html.tmpl
    [[SummaryByMonth]]
        [[[month]]]
            template = archive/month-%Y-%m.html.tmpl
        [[[climato]]]
            template = archive/climato-%Y-%m.html.tmpl
    [[SummaryByYear]]
        [[[year]]]
            template = archive/year-%Y.html.tmpl
        [[[climato_year]]]
            template = archive/climato-%Y.html.tmpl

[CopyGenerator]
    # copy_always : une mise à jour du skin est republiée automatiquement
    copy_always = detail.html, style.css, app.js, detail.js, nav.js, minichart.js, extras.js, climate.js, astro.js, archive.js, climato.js, extremes.html, extremes.js, ensembles.html, ensembles.js, img, vendor

[Generators]
    # générateur Cheetah de weewx + option [[archives]] (pages jour / mois / année / climato)
    generator_list = user.livejson.LiveCheetahGenerator, weewx.reportengine.CopyGenerator
